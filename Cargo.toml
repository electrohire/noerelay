[workspace]
members = [
    "crates/noerelay-core",
    "crates/noerelay-gateway",
    "crates/noerelay-store",
    "bindings/python",
    "xtask",
]
exclude = ["rtk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "3.0"
hex = "0.4"
pyo3 = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["derive", "uuid1", "chrono"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
