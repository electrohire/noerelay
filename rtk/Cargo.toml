[package]
name = "noerelay-compact"
version = "0.1.0"
edition = "2021"
description = "Context compaction for the NoeRelay gateway (formerly RTK)"
license = "MIT"

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[lib]
name = "noerelay_compact"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3