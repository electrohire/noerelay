apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noerelay
  labels:
    app: noerelay
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - noerelay.example.com
    secretName: noerelay-tls
  rules:
  - host: noerelay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: noerelay
            port:
              number: 80