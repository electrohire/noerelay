apiVersion: v1
kind: ConfigMap
metadata:
  name: noerelay-config
  labels:
    app: noerelay
data:
  NOERELAY_BIND: "0.0.0.0:8080"
  NOERELAY_OPENROUTER_MODE: "live"
  NOERELAY_ORGANIZATION_ID: "replace-organization"
  NOERELAY_PROJECT_ID: "replace-project"
  NOERELAY_ENVIRONMENT_ID: "production"
  NOERELAY_BUDGET_LIMIT_MICROUSD: "10000000000"
  NOERELAY_RECEIPT_SIGNING_KEY_ID: "replace-key-id"
  # Deliberately fails startup until a reviewed registry is supplied.
  NOERELAY_CANDIDATES_JSON: "[]"
  NOERELAY_PRODUCTION_MODE: "1"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
