apiVersion: apps/v1
kind: Deployment
metadata:
  name: noerelay
  labels:
    app: noerelay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noerelay
  template:
    metadata:
      labels:
        app: noerelay
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: noerelay
        image: noerelay:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: noerelay-config
        env:
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: noerelay-secrets
              key: openrouter-api-key
        - name: NOERELAY_API_KEY
          valueFrom:
            secretKeyRef:
              name: noerelay-secrets
              key: api-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: noerelay-secrets
              key: database-url
        - name: NOERELAY_RECEIPT_SIGNING_SEED_HEX
          valueFrom:
            secretKeyRef:
              name: noerelay-secrets
              key: receipt-signing-seed-hex
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: tmp
        emptyDir: {}
