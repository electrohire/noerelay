[package]
name = "noerelay-gateway"
description = "OpenAI-compatible Rust gateway for the NoeRelay authority core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
chrono.workspace = true
hex.workspace = true
jsonwebtoken = "11.0"
noerelay-core = { path = "../noerelay-core" }
noerelay-store = { path = "../noerelay-store" }
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
