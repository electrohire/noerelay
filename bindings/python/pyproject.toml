[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "noerelay-core"
version = "0.1.0"
requires-python = ">=3.12"
description = "Bindings to the authoritative NoeRelay Rust policy core"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "noerelay_core"

