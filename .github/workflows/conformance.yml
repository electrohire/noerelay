name: Conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Run conformance suite
        run: python -m unittest discover -s tests -v

      - name: Compile remote smoke checker
        run: python -m py_compile scripts/remote_service_smoke.py
