name: Conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Run conformance suite
        run: python -m unittest discover -s tests -v

      - name: Compile remote smoke checker
        run: python -m py_compile scripts/remote_service_smoke.py
