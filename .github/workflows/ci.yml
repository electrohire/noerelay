name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest jsonschema referencing

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Run smoke check (mocked)
      run: |
        python -m pytest tests/test_remote_smoke.py -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t noerelay:latest .

    - name: Test Docker image
      run: |
        docker run -d --name noerelay-test -p 8080:8080 noerelay:latest
        sleep 5
        curl -s http://127.0.0.1:8080/health
        docker stop noerelay-test
        docker rm noerelay-test